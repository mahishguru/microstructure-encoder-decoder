[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microstructure-encoder-decoder"
version = "1.0.0"
description = "ViT-H/14 encoder + flow-matching diffusion-transformer decoders that learn a searchable latent space of HCP microstructure and texture"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahish K. Guru" }]
keywords = ["microstructure", "texture", "generative model", "flow matching", "diffusion transformer", "magnesium", "inverse design"]
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "peft>=0.12",
    "open_clip_torch>=2.24",
    "huggingface_hub>=0.23",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# test-set metrics, texture prior / ODF calibration, SAM grain segmentation
eval = [
    "orientation-codec @ git+https://github.com/mahishguru/orientation-codec.git",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "scikit-image>=0.21",
    "pytorch-msssim>=1.0",
    "torchmetrics[image]>=1.2",
    "torch-fidelity>=0.3",
    "h5py>=3.8",
]
# ViT-VQGAN reference baseline
vqgan = ["paintmind @ git+https://github.com/Qiyuan-Ge/PaintMind.git@733bcf4e4e44dda1f9b959beb9fd96b13de2dfb1", "lpips", "pandas", "pytorch-fid"]
# latent-space diagnostics in embedding_utils (UMAP projections)
analysis = ["umap-learn>=0.5"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/mahishguru/microstructure-encoder-decoder"

[tool.setuptools.packages.find]
include = ["microstructure_ed*"]

[tool.setuptools.package-data]
microstructure_ed = ["config.json", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
